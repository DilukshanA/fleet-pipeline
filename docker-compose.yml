name: fleet-pipeline

x-app-env: &app-env
  env_file: .env

services:
  # ---------------------------------------------------------------------
  # Ingestion: single-node Kafka in KRaft mode (no ZooKeeper needed).
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: fleet-kafka
    ports:
      - "9094:9094"   # host-visible listener, useful for debugging with a local client
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------------
  # Serving store (app data) + Airflow metadata database, one instance,
  # two databases, to keep the laptop's RAM footprint down.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Streaming source simulator -> Kafka
  # ---------------------------------------------------------------------
  trip-simulator:
    build:
      context: .
      dockerfile: simulators/Dockerfile
    container_name: fleet-trip-simulator
    <<: *app-env
    command: ["python", "simulators/trip_simulator.py"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Daily-batch source simulator -> landing folder (shared volume)
  # ---------------------------------------------------------------------
  cost-simulator:
    build:
      context: .
      dockerfile: simulators/Dockerfile
    container_name: fleet-cost-simulator
    <<: *app-env
    command: ["python", "simulators/cost_simulator.py"]
    volumes:
      - ./data:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Speed layer: Spark Structured Streaming (local[*] deployment mode)
  # ---------------------------------------------------------------------
  spark-stream:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: fleet-spark-stream
    <<: *app-env
    volumes:
      - ./data:/data
      - spark_ivy_cache:/root/.ivy2
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Orchestration: Airflow (LocalExecutor) for the daily batch/reporting DAG
  # ---------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: fleet-airflow-init
    <<: *app-env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Fleet --lastname Admin --role Admin --email admin@example.com || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: ${AIRFLOW_UID}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/common
      - ./data:/data
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: fleet-airflow-webserver
    <<: *app-env
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_UID: ${AIRFLOW_UID}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/common
      - ./data:/data
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: fleet-airflow-scheduler
    <<: *app-env
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: ${AIRFLOW_UID}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/common
      - ./data:/data
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Serving: FastAPI
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fleet-api
    <<: *app-env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
  spark_ivy_cache:
